name: Publicar recetas
on:
  push:
    branches: [main]
    paths:
      - 'datos/recetas/**'
      - 'datos/menus/**'
      - 'plantillas/**'
      - 'scripts/**'
      - 'assets/**'
      - 'imagenes/**'
      - '.github/workflows/publicar-recetas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar código y datos antes de publicar
        run: |
          python -m py_compile scripts/generar.py scripts/validar_menus.py scripts/agrupar_componentes.py scripts/indice_publico.py
          python -m unittest discover -s tests -v
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check assets/inicio.js
          node --check assets/dia.js
          node --check assets/recetario.js
          node --check assets/cocina.js
      - run: python scripts/generar.py
      - name: Guardar páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md indice-recetas.json
          git add index.html
          if [ -d recetario ]; then git add -A recetario; fi
          if [ -d recetas ]; then git add -A recetas; fi
          if [ -d menus ]; then git add -A menus; fi
          git diff --cached --quiet || (git commit -m "Publicar páginas generadas" && git push)
      - name: Verificar lectura pública anónima del índice de recetas
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, time, urllib.request
          from urllib.error import URLError

          expected = Path("README.md").read_text(encoding="utf-8")
          start = "<!-- MIRURECETAS_INDICE_PUBLICO_INICIO: generado automáticamente -->"
          end = "<!-- MIRURECETAS_INDICE_PUBLICO_FIN -->"
          if start not in expected or end not in expected:
              raise SystemExit("No se generó índice público en README")
          block = expected[expected.index(start):expected.index(end)+len(end)]
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          url = ("https://raw.githubusercontent.com/MiruRecetas/menu-anual-recetas/"
                 "main/README.md?version=" + sha)
          for attempt in range(1, 11):
              try:
                  # No se envía Authorization, token ni cookie: comprobación anónima real.
                  request = urllib.request.Request(url, headers={"User-Agent": "MiruRecetas-public-index-check"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      public = response.read().decode("utf-8")
                  if block in public:
                      print("Índice accesible públicamente sin autenticación, versión:", sha)
                      break
                  print("Índice público aún no actualizado, intento", attempt)
              except (URLError, UnicodeError) as error:
                  print("Consulta anónima no disponible, intento", attempt, str(error))
              if attempt == 10:
                  raise SystemExit("No se pudo verificar lectura pública anónima del índice")
              time.sleep(5)
          PY
      - name: Verificar índice JSON publicado en Pages sin autenticación
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          from pathlib import Path
          local = json.loads(Path("indice-recetas.json").read_text(encoding="utf-8"))
          url = "https://mirurecetas.github.io/menu-anual-recetas/indice-recetas.json"
          for attempt in range(1, 25):
              try:
                  request = urllib.request.Request(
                      url + "?source=" + local["source_commit_sha"] + "&retry=" + str(attempt),
                      headers={"User-Agent": "MiruRecetas-Public-Index-Verification",
                               "Cache-Control": "no-cache", "Accept": "application/json"})
                  # Petición anónima, sin token, cookies ni autorización.
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status, mime = response.status, response.headers.get("Content-Type", "")
                      remote = json.loads(response.read().decode("utf-8"))
                  if status == 200 and "json" in mime.lower() and remote == local:
                      print("GET público anónimo verificado:", url)
                      print("Total:", remote["total_recetas"], "SHA origen:", remote["source_commit_sha"])
                      break
                  print("Despliegue o caché pendiente, intento", attempt,
                        "HTTP", status, "SHA visible", remote.get("source_commit_sha"))
              except (urllib.error.URLError, ValueError, UnicodeError) as err:
                  print("Acceso público pendiente, intento", attempt, str(err))
              if attempt == 24:
                  raise SystemExit("Pages no publicó todavía el JSON completo y vigente")
              time.sleep(10)
          PY
