name: Validar web
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis de generador y scripts
        run: |
          python -m py_compile scripts/generar.py scripts/agrupar_componentes.py scripts/validar_menus.py scripts/exportar_airtable.py scripts/indice_publico.py
          python -m unittest discover -s tests -v
          node --check assets/pwa.js
          node --check sw.js
          node --check assets/inicio.js
          node --check assets/recetario.js
          node --check assets/dia.js
          node --check assets/cocina.js
          node --check assets/graficos-semana.js
          node tests/test_graficos_semana.cjs
      - name: Generar y comprobar contrato del recetario
        run: |
          python scripts/generar.py
          test -f indice-recetas.json
          python -m json.tool indice-recetas.json > /dev/null
          test -f index.html
          test -f recetario/index.html
          test -f plantillas/dia.html
          test -f menus/10-1/lunes/index.html
          test -f menus/10-1/viernes/index.html
          grep -q "Patatas panadera" menus/10-1/lunes/index.html
          grep -q "Boniato al horno" menus/10-1/martes/index.html
          grep -q "libre" menus/10-1/viernes/index.html
          grep -q 'id="recipe-catalog"' recetario/index.html
          ! grep -q 'id="recipe-catalog"' index.html
          grep -q 'recetario/' plantillas/receta.html
          sha256sum sw.js index.html recetario/index.html indice-recetas.json > /tmp/miru-first
          python scripts/generar.py
          sha256sum sw.js index.html recetario/index.html indice-recetas.json > /tmp/miru-second
          diff -u /tmp/miru-first /tmp/miru-second
